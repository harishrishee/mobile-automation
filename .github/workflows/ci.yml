name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      android_tags:
        description: "Cucumber tag expression for Android"
        required: false
        default: "@ApiDemos"
      ios_tags:
        description: "Cucumber tag expression for iOS"
        required: false
        default: "@iOS"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build (skip tests)
        run: mvn -B -DskipTests package

  ios-tests:
    runs-on: macos-latest
    env:
      IOS_TAGS: ${{ github.event.inputs.ios_tags || '@iOS' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          SIM_NAME="iPhone 17 Pro"
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          if not runtimes:
              sys.exit(1)
          print(sorted(runtimes, key=lambda r: r.get("version", ""))[-1]["identifier"])
          PY
          )
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          types = [t for t in data.get("devicetypes", []) if "iPhone" in t.get("name", "")]
          if not types:
              sys.exit(1)
          preferred = [t for t in types if t.get("name") == "iPhone 15"]
          print((preferred[0] if preferred else types[-1])["identifier"])
          PY
          )
          SIM_UDID=$(xcrun simctl list devices -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          name = "iPhone 17 Pro"
          for runtime, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("name") == name and d.get("isAvailable"):
                      print(d.get("udid"))
                      sys.exit(0)
          sys.exit(0)
          PY
          )
          if [ -z "${SIM_UDID}" ]; then
            SIM_UDID=$(xcrun simctl create "${SIM_NAME}" "${DEVICE_TYPE_ID}" "${RUNTIME_ID}")
          fi
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b

      - name: Run iOS tests
        env:
          env: ios
        run: |
          appium --log-level error &
          for i in {1..30}; do curl -sf http://127.0.0.1:4723/wd/hub/status && break || sleep 2; done
          mvn -B -Denv=ios -Dtags="${IOS_TAGS}" test

  android-tests:
    runs-on: ubuntu-latest
    env:
      ANDROID_TAGS: ${{ github.event.inputs.android_tags || '@ApiDemos' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER

      - name: Create and start emulator
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "cmdline-tools;latest" "system-images;android-34;google_apis;x86_64"
          mkdir -p "${HOME}/.android/avd"
          echo "no" | ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager create avd -n ci_api_34 -k "system-images;android-34;google_apis;x86_64" --device "pixel_5"
          ${ANDROID_HOME}/emulator/emulator -avd ci_api_34 -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-snapshot-load &
          adb wait-for-device
          adb shell 'while [[ "$(getprop sys.boot_completed)" != "1" ]]; do sleep 1; done'

      - name: Run Android tests
        env:
          env: android
        run: |
          appium --log-level error &
          for i in {1..30}; do curl -sf http://127.0.0.1:4723/wd/hub/status && break || sleep 2; done
          mvn -B -Denv=android -Dtags="${ANDROID_TAGS}" test
