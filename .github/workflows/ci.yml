name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      android_tags:
        description: "Cucumber tag expression for Android"
        required: false
        default: "@ApiDemos"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Build (skip tests)
        run: mvn -B -DskipTests package

  android-tests:
    runs-on: ubuntu-latest
    env:
      ANDROID_TAGS: ${{ github.event.inputs.android_tags || '@ApiDemos' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK and AVD
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}
            ~/.android/avd
            ~/.android
            ~/.appium
            ~/.npm
          key: android-sdk-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER
          # Ensure current user can access /dev/kvm on hosted runner
          sudo chown $USER /dev/kvm
          ls -l /dev/kvm

      - name: Create and start emulator
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          export ANDROID_AVD_HOME="${HOME}/.android/avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "emulator" "cmdline-tools;latest" "system-images;android-34;google_apis;x86_64"
          echo "no" | ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager create avd -n ci_api_34 -k "system-images;android-34;google_apis;x86_64" --device "pixel_5" || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager list avd
          ${ANDROID_HOME}/emulator/emulator -avd ci_api_34 -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-snapshot-load &
          adb wait-for-device
          adb shell 'while [[ "$(getprop sys.boot_completed)" != "1" ]]; do sleep 1; done'

      - name: Run Android tests
        env:
          env: android
        run: |
          appium --log-level error &
          for i in {1..30}; do curl -sf http://127.0.0.1:4723/wd/hub/status && break || sleep 2; done
          mvn -B -Denv=android -Dtags="${ANDROID_TAGS}" test
