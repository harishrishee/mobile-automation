name: iOS CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      ios_tags:
        description: "Cucumber tag expression for iOS"
        required: false
        default: "@iOS"

jobs:
  ios-tests:
    runs-on: macos-latest
    env:
      IOS_TAGS: ${{ github.event.inputs.ios_tags || '@iOS' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Appium and iOS driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          SIM_NAME="iPhone 17 Pro"
          eval "$(python3 - <<'PY'
          import json
          import re
          import shlex
          import subprocess
          import sys

          def run(cmd):
              return subprocess.check_output(cmd, text=True, stderr=subprocess.DEVNULL).strip()

          def load_json(cmd):
              try:
                  out = run(cmd)
                  if not out:
                      return None
                  return json.loads(out)
              except Exception:
                  return None

          runtime_id = None
          runtimes = load_json(["xcrun", "simctl", "list", "runtimes", "-j"])
          if runtimes:
              available = [
                  r for r in runtimes.get("runtimes", [])
                  if r.get("isAvailable") and str(r.get("identifier", "")).startswith("com.apple.CoreSimulator.SimRuntime.iOS")
              ]
              if available:
                  runtime_id = sorted(available, key=lambda r: r.get("version", ""))[-1].get("identifier")

          if not runtime_id:
              try:
                  text = run(["xcrun", "simctl", "list", "runtimes"])
              except Exception:
                  text = ""
              for line in text.splitlines():
                  if "iOS" in line and "com.apple.CoreSimulator.SimRuntime.iOS" in line:
                      match = re.search(r"(com\.apple\.CoreSimulator\.SimRuntime\.iOS[^\s\)]*)", line)
                      if match:
                          runtime_id = match.group(1)
                          break

          if not runtime_id:
              sys.exit("Could not determine iOS runtime")

          device_type_id = None
          types = load_json(["xcrun", "simctl", "list", "devicetypes", "-j"])
          if types:
              iphones = [t for t in types.get("devicetypes", []) if "iPhone" in t.get("name", "")]
              preferred = [t for t in iphones if t.get("name") == "iPhone 15"]
              chosen = preferred[0] if preferred else (iphones[-1] if iphones else None)
              if chosen:
                  device_type_id = chosen.get("identifier")

          if not device_type_id:
              try:
                  text = run(["xcrun", "simctl", "list", "devicetypes"])
              except Exception:
                  text = ""
              for line in text.splitlines():
                  if "iPhone 15" in line:
                      match = re.search(r"(com\.apple\.CoreSimulator\.SimDeviceType\.iPhone[^ ]*)", line)
                      if match:
                          device_type_id = match.group(1)
                          break
              if not device_type_id:
                  for line in text.splitlines():
                      if "iPhone" in line:
                          match = re.search(r"(com\.apple\.CoreSimulator\.SimDeviceType\.iPhone[^ ]*)", line)
                          if match:
                              device_type_id = match.group(1)
                              break

          if not device_type_id:
              sys.exit("Could not determine iPhone device type")

          sim_udid = None
          devices = load_json(["xcrun", "simctl", "list", "devices", "-j"])
          if devices:
              for _, devs in devices.get("devices", {}).items():
                  for d in devs:
                      if d.get("name") == "iPhone 17 Pro" and d.get("isAvailable"):
                          sim_udid = d.get("udid")
                          break
                  if sim_udid:
                      break

          def shquote(value):
              return shlex.quote(value)

          print(f"RUNTIME_ID={shquote(runtime_id)}")
          print(f"DEVICE_TYPE_ID={shquote(device_type_id)}")
          if sim_udid:
              print(f"SIM_UDID={shquote(sim_udid)}")
          PY
          )"
          if [ -z "${SIM_UDID}" ]; then
            SIM_UDID=$(xcrun simctl create "${SIM_NAME}" "${DEVICE_TYPE_ID}" "${RUNTIME_ID}")
          fi
          xcrun simctl shutdown all || true
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b -t 300 || true
          if ! xcrun simctl bootstatus "${SIM_UDID}" -b -t 300; then
            xcrun simctl shutdown "${SIM_UDID}" || true
            xcrun simctl erase "${SIM_UDID}" || true
            xcrun simctl boot "${SIM_UDID}" || true
            xcrun simctl bootstatus "${SIM_UDID}" -b -t 300
          fi

      - name: Run iOS tests
        env:
          env: ios
        run: |
          appium --log-level error &
          for i in {1..30}; do curl -sf http://127.0.0.1:4723/wd/hub/status && break || sleep 2; done
          mvn -B -Denv=ios -Dtags="${IOS_TAGS}" test

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results --clean -o target/allure-report

      - name: Resolve Allure report directory
        if: always()
        id: allure_report_check
        run: |
          if [ -f "target/allure-report/index.html" ]; then
            echo "report_dir=target/allure-report" >> "$GITHUB_OUTPUT"
          else
            echo "report_dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare GitHub Pages content
        if: always() && steps.allure_report_check.outputs.report_dir != ''
        run: |
          BUILD_DIR="gh-pages/ios/${{ github.run_number }}"
          mkdir -p "${BUILD_DIR}"
          cp -R "${{ steps.allure_report_check.outputs.report_dir }}/." "${BUILD_DIR}/"

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.allure_report_check.outputs.report_dir != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
