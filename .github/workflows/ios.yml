name: iOS CI

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      ios_tags:
        description: "Cucumber tag expression for iOS"
        required: false
        default: "@iOS"

jobs:
  ios-tests:
    runs-on: macos-latest
    env:
      IOS_TAGS: ${{ github.event.inputs.ios_tags || '@iOS' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Install Appium and iOS driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Boot iOS Simulator
        run: |
          SIM_NAME="iPhone 15"
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          runtimes = [r for r in data.get("runtimes", []) if r.get("isAvailable") and r.get("identifier", "").startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          if not runtimes:
              sys.exit(1)
          print(sorted(runtimes, key=lambda r: r.get("version", ""))[-1]["identifier"])
          PY
          )
          DEVICE_TYPE_ID=$(xcrun simctl list devicetypes -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          types = [t for t in data.get("devicetypes", []) if "iPhone" in t.get("name", "")]
          if not types:
              sys.exit(1)
          preferred = [t for t in types if t.get("name") == "iPhone 15"]
          print((preferred[0] if preferred else types[-1])["identifier"])
          PY
          )
          SIM_UDID=$(xcrun simctl list devices -j | python3 - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          name = "iPhone 15"
          for runtime, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("name") == name and d.get("isAvailable"):
                      print(d.get("udid"))
                      sys.exit(0)
          sys.exit(0)
          PY
          )
          if [ -z "${SIM_UDID}" ]; then
            SIM_UDID=$(xcrun simctl create "${SIM_NAME}" "${DEVICE_TYPE_ID}" "${RUNTIME_ID}")
          fi
          xcrun simctl boot "${SIM_UDID}" || true
          xcrun simctl bootstatus "${SIM_UDID}" -b

      - name: Run iOS tests
        env:
          env: ios
        run: |
          appium --log-level error &
          for i in {1..30}; do curl -sf http://127.0.0.1:4723/wd/hub/status && break || sleep 2; done
          mvn -B -Denv=ios -Dtags="${IOS_TAGS}" test

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate target/allure-results --clean -o target/allure-report

      - name: Resolve Allure report directory
        if: always()
        id: allure_report_check
        run: |
          if [ -f "target/allure-report/index.html" ]; then
            echo "report_dir=target/allure-report" >> "$GITHUB_OUTPUT"
          else
            echo "report_dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare GitHub Pages content
        if: always() && steps.allure_report_check.outputs.report_dir != ''
        run: |
          BUILD_DIR="gh-pages/ios/${{ github.run_number }}"
          mkdir -p "${BUILD_DIR}"
          cp -R "${{ steps.allure_report_check.outputs.report_dir }}/." "${BUILD_DIR}/"

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request' && steps.allure_report_check.outputs.report_dir != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true
