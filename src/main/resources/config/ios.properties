mobile.platform=ios

# Appium server URL
appium.server.url=http://localhost:4723

# Real device configuration (IPA works on real device)
#mobile.device.name=iPhone
# mobile.udid=35AFD262-B9F9-484F-AC55-802F44B95707
# platform version must match your device (minimum iOS 14.3)
# mobile.platform.version=17.5

# Simulator configuration (requires a simulator .app build)
mobile.device.name=iPhone 17 Pro
# Let the simulator runtime decide the platform version on CI.
# mobile.platform.version=26.2

# App configuration (simulator build)
mobile.app.path=src/test/resources/apps/My Demo App.app

# Automation name
mobile.automation.name=XCUITest

# Reset options
mobile.noReset=true
mobile.fullReset=false

# WDA timeouts (CI can be slow)
ios.wdaLaunchTimeout=120000
ios.wdaStartupRetries=3
ios.wdaStartupRetryInterval=10000

# Reporting and screenshots
screenshot.steps=false
screenshot.scenario=true

# Retry settings
retry.count=1

# Cucumber tags (used when not passed via CLI)
cucumber.tags=@iOS
